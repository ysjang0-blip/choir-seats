<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찬양대 자리배치</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 0 auto; padding: 16px; max-width: 720px; background: #fafafa; }
  h1 { font-size: 22px; text-align: center; }
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .inputs label { display: flex; flex-direction: column; font-size: 14px; gap: 4px; }
  .inputs input { font-size: 20px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; width: 100%; box-sizing: border-box; }
  button.action { width: 100%; font-size: 18px; padding: 12px; border: 0; border-radius: 8px; background: #4E79A7; color: #fff; margin-bottom: 8px; cursor: pointer; }
  button.action.secondary { background: #59A14F; }
  button.action.kakao { background: #FEE500; color: #3C1E1E; font-weight: bold; }
  .stepper { display: flex; gap: 6px; }
  .stepper input { flex: 1; min-width: 0; text-align: center; }
  .stepper button { width: 52px; font-size: 26px; padding: 0; border: 1px solid #ccc; border-radius: 8px; background: #eee; color: #333; cursor: pointer; }
  #error { color: #c0392b; font-weight: bold; white-space: pre-line; margin: 8px 0; }
  #notice { color: #33608f; font-size: 14px; white-space: pre-line; margin: 8px 0; }
  #chartWrap svg { width: 100%; height: auto; background: #fff; border: 1px solid #eee; border-radius: 8px; }
  .note { font-size: 12px; color: #888; text-align: center; }
</style>
</head>
<body>
<h1>찬양대 자리배치</h1>
<div class="inputs">
  <label>소프라노
    <div class="stepper">
      <button type="button" data-part="soprano" data-delta="-1">−</button>
      <input id="soprano" type="number" min="0" inputmode="numeric" placeholder="0">
      <button type="button" data-part="soprano" data-delta="1">+</button>
    </div>
  </label>
  <label>알토
    <div class="stepper">
      <button type="button" data-part="alto" data-delta="-1">−</button>
      <input id="alto" type="number" min="0" inputmode="numeric" placeholder="0">
      <button type="button" data-part="alto" data-delta="1">+</button>
    </div>
  </label>
  <label>테너
    <div class="stepper">
      <button type="button" data-part="tenor" data-delta="-1">−</button>
      <input id="tenor" type="number" min="0" inputmode="numeric" placeholder="0">
      <button type="button" data-part="tenor" data-delta="1">+</button>
    </div>
  </label>
  <label>베이스
    <div class="stepper">
      <button type="button" data-part="bass" data-delta="-1">−</button>
      <input id="bass" type="number" min="0" inputmode="numeric" placeholder="0">
      <button type="button" data-part="bass" data-delta="1">+</button>
    </div>
  </label>
</div>
<button id="assignBtn" class="action">배치하기</button>
<button id="saveBtn" class="action secondary" hidden>이미지로 저장</button>
<button id="shareBtn" class="action kakao" hidden>카톡으로 공유</button>
<div id="error"></div>
<div id="notice"></div>
<div id="chartWrap"></div>
<p class="note">배치도는 지휘자가 찬양대를 바라본 방향 기준입니다.</p>
<script src="assign.js"></script>
<script>
const COLORS = { soprano: "#E15759", alto: "#EDC948", bass: "#4E79A7", tenor: "#59A14F" };
const NAMES = { soprano: "소프라노", alto: "알토", tenor: "테너", bass: "베이스" };
const NUM_COLORS = { soprano: "#E15759", alto: "#C9A227", bass: "#4E79A7", tenor: "#59A14F" };
const SEAT = 38, R = 15, BENCH_H = 46, TOP = 20, PAD = 8;
const ROW_GAP = 80;                      // 앞뒤 줄 간격: 의자 한 줄(46)보다 넉넉히 벌린다(그 공간에 인원 숫자를 쓴다)
const CHART_W = 1370, CHART_H = 750;     // 그림 전체 크기
const LEFT_X = 90;                       // 왼쪽 블록 시작 x
const RIGHT_EDGE = 1280;                 // 오른쪽 블록의 오른쪽 끝 x (90도 수직 변 — 사다리꼴의 직각 쪽)
const NUM_SIZE = 92;                     // 인원 숫자 크기 (벌려 놓은 앞뒤 공간을 꽉 채움)

function seatCircle(cx, cy, color) {
  return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${color}" stroke="#00000022"/>`;
}
// 한 줄: 왼쪽부터 leftN명은 leftPart 색, 나머지는 rightPart 색.
// 지그재그일 때는 줄 전체를 통째로 옮긴다. 기준은 가운데 통로 쪽(anchor):
// 1·3·5번째 줄은 가운데 쪽 끝에 바짝 붙고(반대쪽 끝은 띄워짐),
// 2·4번째 줄은 반 칸 물러나 앞줄과 엇갈린다.
// 지그재그가 아니면(일렬) 모든 줄이 같은 간격으로 놓이고 각 줄을 의자 가운데에 맞춘다.
// blockGap은 지그재그일 때는 지그재그 간격, 일렬일 때는 일렬 간격이다.
// 인원 숫자는 의자 바로 아래(앞뒤로 벌려 놓은 빈 공간)에 쓴다.
//  - 왼쪽 블록(leftBlock): 맨 오른쪽 끝에 알토 인원,
//    소프라노 자리의 오른쪽 끝에 알토 자리로 넘어온 소프라노(5-알토), 왼쪽 끝에 나머지 소프라노
//  - 오른쪽 블록: 왼쪽 끝에 베이스 인원, 오른쪽 끝에 테너 인원
function rowSvg(x, y, cap, leftPart, leftN, rightPart, rightN, rowIndex, zigzag, anchor, blockGap, flushParity, leftBlock) {
  const w = cap * SEAT + PAD * 2;
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${BENCH_H}" rx="10" fill="#f5efe3" stroke="#c9bda5"/>`;
  const total = leftN + rightN;
  if (total > 0) {
    const cy = y + BENCH_H / 2;
    const xs = [];
    if (zigzag) {
      // 간격은 블록 전체가 공유(blockGap): 줄마다 간격이 다르면
      // 인원이 다른 줄끼리 지그재그가 어긋나므로 같은 격자 위에 놓는다.
      const gap = blockGap;
      // flushParity와 홀짝이 같은 줄이 anchor 쪽 끝에 바짝 붙고, 나머지는 반 칸 안쪽
      // (왼쪽 블록: 1·3·5줄이 오른쪽 끝, 오른쪽 블록: 2·4줄이 오른쪽 끝)
      const offset = rowIndex % 2 === flushParity ? 0 : gap / 2;
      for (let k = 0; k < total; k++) {
        if (anchor === "right") xs.push(x + w - PAD - R - offset - (total - 1 - k) * gap);
        else xs.push(x + PAD + R + offset + k * gap);
      }
    } else {
      // 일렬: 모든 줄이 같은 간격을 쓰고, 줄 전체를 의자 가운데에 맞춘다.
      // 남는 여유가 양 끝으로 반씩 나뉘므로 한쪽 끝에만 빈틈이 몰리지 않는다.
      const span = (total - 1) * blockGap;
      const start = x + w / 2 - span / 2;
      for (let k = 0; k < total; k++) xs.push(start + k * blockGap);
    }
    xs.forEach((cx, k) => { s += seatCircle(cx, cy, k < leftN ? COLORS[leftPart] : COLORS[rightPart]); });

    // 의자 아래 빈 공간의 가운데에 숫자를 쓴다.
    const ty = y + BENCH_H + ROW_GAP / 2 + NUM_SIZE * 0.35;
    const num = (nx, align, part, v) => v > 0
      ? `<text x="${nx}" y="${ty}" text-anchor="${align}" font-family="sans-serif" font-size="${NUM_SIZE}" font-weight="bold" fill="${NUM_COLORS[part]}">${v}</text>`
      : "";
    if (leftBlock) {
      const sp = sopranoSplit(leftN, rightN);
      // 알토와 소프라노 왼쪽 숫자는 사람 끝이 아니라 의자(좌석) 끝에 맞춘다.
      s += num(x + w - PAD, "end", rightPart, rightN);            // 알토: 좌석 오른쪽 끝 아래
      s += num(x + PAD, "start", leftPart, sp.left);              // 소프라노: 좌석 왼쪽 끝 아래
      // 알토 자리로 넘어온 소프라노만 그 인원들의 한가운데 아래에 둔다.
      if (sp.right > 0) {
        const from = sp.left;
        s += num((xs[from] + xs[from + sp.right - 1]) / 2, "middle", leftPart, sp.right);
      }
    } else {
      s += num(xs[total - 1] + R, "end", rightPart, rightN);      // 테너: 오른쪽 끝 아래
      s += num(xs[0] - R, "start", leftPart, leftN);              // 베이스: 왼쪽 끝 아래
    }
  }
  return s;
}

function renderChart(result) {
  const counts = {
    soprano: result.left.reduce((a, r) => a + r.soprano, 0),
    alto: result.left.reduce((a, r) => a + r.alto, 0),
    bass: result.right.reduce((a, r) => a + r.bass, 0),
    tenor: result.right.reduce((a, r) => a + r.tenor, 0),
  };
  // 소프라노+알토 합이 50명부터는 왼쪽 블록은 지그재그 없이 똑바로 줄을 선다.
  const leftZigzag = counts.soprano + counts.alto < 50;
  // 블록 공통 지그재그 간격: 각 줄이 의자를 최대한 채우도록 간격을 벌리되,
  // 어떤 줄도 의자를 벗어나지 않는 값(줄별 최소치)을 쓴다.
  // 끝에 바짝 붙는 줄은 (인원-1)칸, 반 칸 물러나는 줄은 (인원-0.5)칸을 차지한다.
  const gapOf = (rows, flushParity) => {
    const cands = rows.filter(r => r.total > 0)
      .map(r => (r.cap * SEAT - R * 2) / Math.max(r.total - (r.i % 2 === flushParity ? 1 : 0.5), 1.5));
    return cands.length ? Math.min(...cands) : 0;
  };
  // 일렬일 때의 블록 공통 간격: 가장 인원이 많은 줄이 의자를 끝에서 끝까지 채우는 값.
  // 인원이 적은 줄도 같은 간격을 쓰고 가운데 정렬하므로 줄끼리 간격이 어긋나지 않는다.
  const straightGapOf = rows => {
    const cands = rows.filter(r => r.total > 1).map(r => (r.cap * SEAT - R * 2) / (r.total - 1));
    return cands.length ? Math.min(...cands) : 0;
  };
  const leftRows = result.left.map((r, i) => ({ cap: r.capacity, total: r.soprano + r.alto, i }));
  const leftGap = leftZigzag ? gapOf(leftRows, 0) : straightGapOf(leftRows);
  const rightGap = gapOf(result.right.map((r, i) => ({ cap: r.capacity, total: r.bass + r.tenor, i })), 1);
  let s = `<svg id="chart" xmlns="http://www.w3.org/2000/svg" width="${CHART_W}" height="${CHART_H}" viewBox="0 0 ${CHART_W} ${CHART_H}">`;
  s += `<rect x="0" y="0" width="${CHART_W}" height="${CHART_H}" fill="#ffffff"/>`;
  s += `<text x="${CHART_W / 2}" y="682" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#666">▼ 앞 (지휘자석) · 지휘자가 바라본 방향</text>`;
  // 맨 앞줄(1줄)이 그림 아래쪽: 지휘자(맨 앞)가 바라본 모습 그대로
  result.left.forEach((row, i) => {
    const y = TOP + (4 - i) * (BENCH_H + ROW_GAP);
    s += rowSvg(LEFT_X, y, row.capacity, "soprano", row.soprano, "alto", row.alto, i, leftZigzag, "right", leftGap, 0, true);
  });
  // 오른쪽 블록: 오른쪽 끝을 수직으로 맞추고(90도), 의자가 뒤로 갈수록 길어져 왼쪽이 사선인 사다리꼴.
  // 사람은 오른쪽 끝 기준으로 앉히되 2·4줄이 끝에 바짝 붙는다.
  result.right.forEach((row, i) => {
    const y = TOP + (4 - i) * (BENCH_H + ROW_GAP);
    const w = row.capacity * SEAT + PAD * 2;
    s += rowSvg(RIGHT_EDGE - w, y, row.capacity, "bass", row.bass, "tenor", row.tenor, i, true, "right", rightGap, 1, false);
  });
  const legendY = 720;
  ["soprano", "alto", "bass", "tenor"].forEach((part, i) => {
    const x = 60 + i * 280;
    s += `<circle cx="${x}" cy="${legendY}" r="13" fill="${COLORS[part]}"/>`;
    s += `<text x="${x + 22}" y="${legendY + 7}" font-family="sans-serif" font-size="22" fill="#333">${NAMES[part]} ${counts[part]}명</text>`;
  });
  return s + `</svg>`;
}

function runAssign() {
  const num = id => Number(document.getElementById(id).value || 0);
  const result = assignSeats({ soprano: num("soprano"), alto: num("alto"), tenor: num("tenor"), bass: num("bass") });
  const errorEl = document.getElementById("error");
  const wrap = document.getElementById("chartWrap");
  const saveBtn = document.getElementById("saveBtn");
  const shareBtn = document.getElementById("shareBtn");
  document.getElementById("notice").textContent = "";
  if (!result.ok) {
    errorEl.textContent = result.errors.join("\n");
    wrap.innerHTML = "";
    saveBtn.hidden = true;
    shareBtn.hidden = true;
    return;
  }
  errorEl.textContent = "";
  wrap.innerHTML = renderChart(result);
  saveBtn.hidden = false;
  shareBtn.hidden = false;
}
document.getElementById("assignBtn").addEventListener("click", runAssign);

// +/- 버튼: 한 번 누르면 인원 변경과 배치도 갱신이 동시에 된다.
document.querySelectorAll(".stepper button").forEach(btn => {
  btn.addEventListener("click", () => {
    const input = document.getElementById(btn.dataset.part);
    input.value = Math.max(0, (Number(input.value) || 0) + Number(btn.dataset.delta));
    runAssign();
  });
});

// 화면의 SVG 배치도를 그대로 캔버스에 그린다(저장·공유 공통).
function svgToCanvas() {
  return new Promise((resolve, reject) => {
    const svg = document.getElementById("chart");
    if (!svg) return reject(new Error("배치도가 없습니다"));
    const xml = new XMLSerializer().serializeToString(svg);
    const blob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const scale = 2; // 카톡 공유용 고해상도
      const canvas = document.createElement("canvas");
      canvas.width = CHART_W * scale;
      canvas.height = CHART_H * scale;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지 변환 실패")); };
    img.src = url;
  });
}
function svgToPngDataUrl() { return svgToCanvas().then(c => c.toDataURL("image/png")); }
function svgToPngFile() {
  return svgToCanvas().then(canvas => new Promise((resolve, reject) => {
    canvas.toBlob(b => {
      if (!b) return reject(new Error("이미지 변환 실패"));
      resolve(new File([b], pngFileName(), { type: "image/png" }));
    }, "image/png");
  }));
}
function pngFileName() {
  const today = new Date().toISOString().slice(0, 10);
  return `자리배치_${today}.png`;
}
window.__testPng = svgToPngDataUrl;

const noticeEl = document.getElementById("notice");
const errorEl2 = document.getElementById("error");

document.getElementById("saveBtn").addEventListener("click", async () => {
  noticeEl.textContent = "";
  try {
    const dataUrl = await svgToPngDataUrl();
    const a = document.createElement("a");
    a.download = pngFileName();
    a.href = dataUrl;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (e) {
    errorEl2.textContent = "이미지 저장 중 문제가 생겼어요: " + e.message;
  }
});

// 휴대폰의 공유 기능(공유 시트)을 띄운다. 목록에서 카카오톡을 고르면 바로 전송된다.
// 공유 기능이 없는 기기(주로 PC)에서는 저장 후 직접 첨부하도록 안내한다.
document.getElementById("shareBtn").addEventListener("click", async () => {
  noticeEl.textContent = "";
  errorEl2.textContent = "";
  try {
    const file = await svgToPngFile();
    if (!navigator.canShare || !navigator.canShare({ files: [file] })) {
      noticeEl.textContent = "이 기기에서는 바로 공유가 안 돼요.\n'이미지로 저장'을 누른 뒤, 카톡에서 사진으로 첨부해 보내주세요.";
      return;
    }
    await navigator.share({ files: [file], title: "찬양대 자리배치" });
  } catch (e) {
    if (e && e.name === "AbortError") return; // 사용자가 공유를 취소함
    noticeEl.textContent = "공유하지 못했어요: " + e.message +
      "\n'이미지로 저장'을 누른 뒤, 카톡에서 사진으로 첨부해 보내주세요.";
  }
});
</script>
</body>
</html>
